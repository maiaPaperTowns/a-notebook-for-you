<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>a notebook for you</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>window.LeafletLib=window.L</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=ZCOOL+KuaiLe&family=Nunito:wght@400;700;800&family=Quicksand:wght@500;700&display=swap">
<style>
/* Layout: one scrapbook notebook on cream porcelain paper; cobalt band + blue-and-white flower sprays framing the page;
   each page = torn paper held by washi tape; songs = a vinyl player with a rounded playlist.
   Palette: cream porcelain, cobalt glaze, dusty vinyl blue, grey cards, one soft pink for love. */
:root{
  --sky:#f5f2e8;          /* page background: porcelain cream */
  --grid:#ebe5d4;         /* faint paper dots */
  --paper:#fffdf8;        /* torn paper */
  --paper-2:#eef1f4;      /* grey cards (vinyl UI) */
  --ink:#2b3f63;          /* navy ink */
  --ink-soft:#7f98b2;
  --cobalt:#2f5597;       /* porcelain glaze */
  --cobalt-2:#5b82c0;
  --dusty:#8fb0c4;        /* vinyl-UI blue */
  --pink:#f3c6d2;
  --pink-ink:#b85479;
  --butter:#f4e6b5;
  --tape:#a9c4e6;
  --line:#dde5ee;
  --shadow:rgba(43,63,99,.13);
  --f-hand:"Itim","ZCOOL KuaiLe","Comic Sans MS",cursive;
  --f-zh:"ZCOOL KuaiLe","Itim","PingFang SC","Microsoft YaHei",cursive;
  --f-round:"Quicksand","Nunito",system-ui,sans-serif;
  --f-body:"Nunito","Itim",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#121c30;--grid:#1c2943;--paper:#1d2a44;--paper-2:#24334f;--ink:#eef2f8;--ink-soft:#a3b8d0;--cobalt:#8fb2ec;--cobalt-2:#6d93d3;--dusty:#89aac0;
  --pink:#d68da3;--pink-ink:#ffb3c9;--butter:#c2b072;--tape:#4f72a6;--line:#2f4166;--shadow:rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#121c30;--grid:#1c2943;--paper:#1d2a44;--paper-2:#24334f;--ink:#eef2f8;--ink-soft:#a3b8d0;--cobalt:#8fb2ec;--cobalt-2:#6d93d3;--dusty:#89aac0;
  --pink:#d68da3;--pink-ink:#ffb3c9;--butter:#c2b072;--tape:#4f72a6;--line:#2f4166;--shadow:rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{
  background-color:var(--sky);
  background-image:radial-gradient(var(--grid) 1.4px,transparent 1.6px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 64px;overflow-x:hidden;
}
html[lang="zh"] body{font-family:var(--f-zh)}
h1,h2,h3{font-family:var(--f-hand);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
html[lang="zh"] h1,html[lang="zh"] h2,html[lang="zh"] h3{font-family:var(--f-zh)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px dashed var(--pink-ink);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;display:grid;gap:44px}

/* ---- porcelain decor (fixed, behind content) ---- */
.decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.band{position:absolute;top:0;bottom:0;right:7%;width:min(17vw,170px);
  background:radial-gradient(ellipse at 30% 20%,color-mix(in srgb,var(--cobalt-2) 70%,transparent),transparent 60%),
             radial-gradient(ellipse at 70% 75%,color-mix(in srgb,var(--cobalt) 40%,black),transparent 65%),var(--cobalt);opacity:.9}
.spray{position:absolute;color:var(--cobalt)}
.spray.tl{top:-20px;left:-30px;width:min(48vw,380px)}
.spray.br{bottom:-30px;right:2%;width:min(42vw,320px);transform:rotate(180deg)}
.spray.mr{top:38%;right:calc(7% - 40px);width:min(26vw,200px);transform:rotate(100deg);opacity:.8}
@media (max-width:640px){.band{right:0;width:10px;opacity:.7}.spray.mr{display:none}.spray.tl{width:62vw}.spray.br{width:56vw}}
h2{color:var(--cobalt)}

/* ---- browser-window frame (ref 2) ---- */
.window{background:var(--paper-2);border:2px solid var(--line);border-radius:18px;box-shadow:0 10px 30px var(--shadow);overflow:hidden}
.chrome{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:var(--ink-soft);opacity:.45}
.addr{flex:1 1 180px;min-width:0;background:var(--paper);border-radius:999px;padding:4px 14px;font-size:13px;color:var(--ink-soft);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;gap:4px;background:var(--paper);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;border-radius:999px;padding:3px 12px;font-family:var(--f-hand);font-size:15px;color:var(--ink-soft)}
.langs button[aria-pressed="true"]{background:var(--pink);color:#4a2333}
.sound{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-family:var(--f-hand);font-size:14px}
.sound[aria-pressed="true"]{background:var(--butter);border-color:var(--butter);color:#4d4220}

/* ---- hero ---- */
.hero{position:relative;padding:34px 22px 30px;display:grid;justify-items:center;text-align:center;gap:14px}
.script{font-family:"Itim",cursive;color:var(--ink-soft);font-size:15px;letter-spacing:.2em;text-transform:uppercase}
.hero h1{font-size:clamp(34px,7vw,58px);color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--pink-ink)}
.hero p{max-width:46ch;margin:0;color:var(--ink-soft)}
.love-btn{position:relative;margin-top:8px;border:0;padding:16px 30px;border-radius:999px;background:var(--pink);color:#4a2333;
  font-family:var(--f-hand);font-size:22px;box-shadow:0 5px 0 var(--pink-ink);transition:transform .12s}
.love-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-ink)}
.love-out{min-height:2.4em;font-family:var(--f-hand);font-size:clamp(24px,5vw,34px);color:var(--pink-ink)}
.love-out small{display:block;font-size:14px;color:var(--ink-soft)}
.burst{position:fixed;pointer-events:none;font-size:22px;z-index:50;animation:float 1.4s ease-out forwards}
@keyframes float{to{transform:translate(var(--dx),-140px) rotate(var(--r));opacity:0}}

/* ---- tabs ---- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tabs a{font-family:var(--f-hand);text-decoration:none;color:var(--ink);background:var(--paper);border:2px solid var(--line);
  padding:4px 14px;border-radius:10px 10px 4px 4px;font-size:15px;transform:rotate(var(--t,0deg))}
.tabs a:nth-child(odd){--t:-1.5deg}.tabs a:nth-child(3n){--t:1.5deg;background:var(--butter);border-color:var(--butter);color:#4d4220}
.tabs a:hover{background:var(--pink);border-color:var(--pink);color:#4a2333}

/* ---- notebook page (torn paper + tape) ---- */
.page{position:relative;background:var(--paper);padding:38px clamp(18px,4vw,40px) 34px;border-radius:4px;box-shadow:0 8px 22px var(--shadow);
  transform:rotate(var(--tilt,0deg));scroll-margin-top:20px;
  -webkit-mask:radial-gradient(7px at 50% 100%,#0000 97%,#000) 50% calc(100% + 0px)/18px 100% repeat-x;}
.page:nth-of-type(even){--tilt:.5deg}.page:nth-of-type(odd){--tilt:-.4deg}
.tape{position:absolute;top:-12px;left:50%;width:120px;height:30px;transform:translateX(-50%) rotate(-3deg);
  background:radial-gradient(circle at 50% 50%,var(--cobalt) 2px,transparent 3px) 0 0/12px 12px,repeating-linear-gradient(45deg,var(--tape) 0 6px,color-mix(in srgb,var(--tape) 70%,white) 6px 12px);opacity:.85;border-radius:2px}
.page h2{font-family:var(--f-round);font-weight:700;letter-spacing:-.01em}
html[lang="zh"] .page h2{font-family:var(--f-zh)}
.tape.pink{background:repeating-linear-gradient(90deg,var(--pink) 0 8px,color-mix(in srgb,var(--pink) 60%,white) 8px 16px);left:22%}
.tape.butter{background:var(--butter);left:auto;right:6%;transform:rotate(6deg)}
.page h2{font-size:clamp(26px,4.6vw,36px);margin-bottom:4px}
.page .sub{color:var(--ink-soft);margin:0 0 22px;max-width:60ch}
.sticker{position:absolute;font-size:30px;right:22px;top:18px;transform:rotate(12deg);filter:drop-shadow(0 2px 2px var(--shadow))}

.btn{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 18px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-hand);font-size:16px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#4a2333}
.btn.butter{background:var(--butter);color:#4d4220}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ---- study corner ---- */
.study{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:18px}
.card{background:var(--paper-2);border:2px dashed var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.card h3{font-size:20px}
.note-out{font-family:var(--f-hand);font-size:18px;min-height:3.2em;color:var(--pink-ink)}
.timer{font-family:var(--f-hand);font-size:44px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.bunny{font-size:54px;border:0;background:transparent;line-height:1;transition:transform .15s;justify-self:start}
.bunny.squish{transform:scale(1.15,.85)}

/* ---- diary ---- */
.diary-form{display:grid;gap:10px;margin-bottom:22px}
.diary-form textarea{min-height:90px;resize:vertical;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper-2);
  background-image:linear-gradient(transparent 27px,var(--line) 28px);background-size:100% 28px;line-height:28px}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:16px}
.postit{padding:14px 14px 12px;border-radius:3px;box-shadow:2px 4px 10px var(--shadow);min-width:0;transform:rotate(var(--r,0deg));color:#3f3a2a;background:#fdf1b8}
.postit.them{background:#fbd7e2;color:#4a2333}
.postit p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-hand);font-size:17px}
.postit .meta{font-size:12px;opacity:.75;display:flex;justify-content:space-between;gap:8px}
.postit button{border:0;background:transparent;font-size:12px;opacity:.6;padding:0}
.example-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}

/* ---- game card ---- */
.game{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.polaroid{background:#fff;padding:10px 10px 30px;box-shadow:0 6px 16px var(--shadow);transform:rotate(-4deg);width:130px;text-align:center;color:#33506e;font-family:var(--f-hand)}
.polaroid div{height:110px;background:linear-gradient(160deg,#2b3242,#556178);display:grid;place-items:center;font-size:48px}
.idbox{font-family:var(--f-hand);font-size:26px;letter-spacing:.08em;background:var(--paper-2);border:2px dashed var(--ink-soft);border-radius:10px;padding:4px 14px;user-select:all;display:inline-block}
.chicken{color:var(--ink-soft);font-size:14px}
.acct{display:grid;gap:2px;justify-items:start}
.acct .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.acct-name{font-family:var(--f-zh);font-size:30px;color:var(--cobalt);line-height:1.2;overflow-wrap:anywhere}
@media (max-width:520px){.game{grid-template-columns:1fr}.polaroid{justify-self:center}}

/* ---- fixes ---- */
.fixes{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.fixes li{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;align-items:start;padding-bottom:14px;border-bottom:2px dotted var(--line)}
.fixes .box{width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;margin-top:4px;display:grid;place-items:center;font-size:14px;color:var(--pink-ink)}
.fixes .was{text-decoration:line-through;text-decoration-color:var(--pink-ink);text-decoration-thickness:2px;color:var(--ink-soft)}
.fixes .now{grid-column:2;font-family:var(--f-hand);font-size:18px}

/* ---- letter ---- */
.envelope{display:grid;justify-items:center;gap:16px}
.env-btn{width:min(320px,100%);aspect-ratio:16/10;max-width:100%;border:0;border-radius:10px;background:var(--pink);position:relative;overflow:hidden;box-shadow:0 8px 20px var(--shadow)}
.env-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,color-mix(in srgb,var(--pink) 75%,black) 50%,transparent 51%),linear-gradient(to bottom left,transparent 49.5%,color-mix(in srgb,var(--pink) 75%,black) 50%,transparent 51%);opacity:.35}
.env-btn span{position:relative;font-family:var(--f-hand);font-size:20px;color:#4a2333;background:var(--paper);padding:4px 14px;border-radius:999px}
.letter{max-width:60ch;background:var(--paper-2);border-radius:8px;padding:22px 24px;font-family:var(--f-hand);font-size:18px;line-height:1.8;
  background-image:linear-gradient(transparent 31px,var(--line) 32px);background-size:100% 32px;white-space:pre-line;animation:unfold .6s ease-out}
@keyframes unfold{from{transform:scaleY(.2);opacity:.2}}

/* ---- reasons ---- */
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:18px}
.reason{background:var(--paper-2);border-radius:12px;padding:16px 16px 14px;border:2px solid var(--line);transition:transform .5s cubic-bezier(.3,1.6,.5,1),border-color .5s;min-width:0}
.reason.lit{transform:rotate(var(--r,-1deg)) scale(1.02);border-color:var(--pink)}
.reason .n{font-family:var(--f-hand);color:var(--pink-ink);font-size:14px}
.reason p{margin:4px 0 0;font-family:var(--f-hand);font-size:18px}
.note-fly{position:absolute;font-size:20px;pointer-events:none;animation:float 1.2s ease-out forwards;--dx:14px;--r:20deg}

/* ---- songs: vinyl player + rounded playlist ---- */
.player{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:32px;align-items:start;margin-bottom:30px}
.deckcol{min-width:0;display:grid;gap:18px}
.deck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;min-width:0}
.turntable{position:relative;width:clamp(130px,17vw,180px);aspect-ratio:1;flex:none;margin:10px 14px 0 0}
.vinyl{position:relative;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle,var(--paper) 0 13%,var(--dusty) 13% 30%,#111 30.5%),
             repeating-radial-gradient(circle,#1b1b1b 0 2px,#262626 2px 3px);box-shadow:0 10px 24px var(--shadow)}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 12%,rgba(255,255,255,.18) 15%,transparent 20% 60%,rgba(255,255,255,.12) 64%,transparent 70%)}
.vinyl.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{position:absolute;left:92%;top:-6%;width:8px;height:58%;border-radius:6px;background:var(--dusty);transform-origin:50% 6px;transform:rotate(12deg);transition:transform .6s;box-shadow:0 3px 6px var(--shadow)}
.arm.on{transform:rotate(30deg)}
.arm::before{content:"";position:absolute;top:-6px;left:-5px;width:20px;height:20px;border-radius:50%;background:var(--paper-2);border:4px solid var(--dusty)}
.now{min-width:0}
.now h3{font-family:var(--f-round);font-weight:700;font-size:clamp(24px,3.2vw,34px);color:var(--dusty);overflow-wrap:break-word;word-break:keep-all;line-height:1.15}
.now h3 .ctl{font-size:14px}
html[lang="zh"] .now h3{font-family:var(--f-zh)}
.now .artist{font-style:italic;color:var(--ink-soft)}
.now .why{font-family:var(--f-round);color:var(--ink-soft);margin:10px 0 12px;white-space:pre-line;max-width:46ch}
.now .ctrl{display:flex;gap:10px;align-items:center}
.pbtn{width:46px;height:46px;border-radius:12px;border:0;background:var(--dusty);color:#fff;font-size:18px;display:grid;place-items:center;box-shadow:0 4px 10px var(--shadow)}
.now a{color:var(--dusty);font-family:var(--f-round);font-weight:700}
.plist h3{font-family:var(--f-round);font-weight:700;font-size:30px;color:var(--dusty);margin-bottom:10px}
.plist ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.plist button{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:3px solid transparent;
  background:var(--paper-2);border-radius:16px;padding:8px 12px;font-family:var(--f-round)}
.plist button[aria-current="true"]{border-color:var(--dusty);background:var(--paper)}
.plist .thumb{width:44px;height:44px;border-radius:10px;background:radial-gradient(circle,var(--paper) 0 10%,var(--dusty) 10% 26%,#1b1b1b 27%);}
.plist b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist small{color:var(--dusty)}
@media (max-width:780px){.player{grid-template-columns:1fr}}
@media (max-width:520px){.deck{grid-template-columns:1fr;justify-items:center;text-align:center}.now .ctrl{justify-content:center}.now .why{margin-inline:auto}.turntable{width:150px;margin:10px 0 0}}

/* ---- songs as tickets (ref 3) ---- */
.tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:20px}
.ticket{position:relative;background:linear-gradient(160deg,#dbe9f7,#f7fbff);color:#2c4865;border-radius:10px;padding:16px 18px 14px;box-shadow:0 6px 16px var(--shadow);min-width:0;
  -webkit-mask:radial-gradient(10px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(10px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat}
.ticket .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.ticket h3{font-size:22px;margin:2px 0}
.ticket .artist{font-size:14px;opacity:.85}
.ticket hr{border:0;border-top:2px dashed #9dbbd8;margin:12px 0 10px}
.ticket .why{font-family:var(--f-hand);font-size:16px;margin:0 0 10px}
.ticket .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.ticket a{color:#2c4865;font-weight:700}
.barcode{height:22px;width:90px;background:repeating-linear-gradient(90deg,#2c4865 0 2px,transparent 2px 4px,#2c4865 4px 5px,transparent 5px 8px)}

/* ---- ENFP x INTJ ---- */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:420px;flex:1 1 260px}
.mbti-row{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.mini-pic{margin:0;background:#fff;padding:8px 8px 22px;box-shadow:0 6px 16px var(--shadow);transform:rotate(3deg);width:min(190px,60%);flex:0 0 auto}
.mini-pic img{display:block;width:100%;height:auto;max-width:100%}
.mcard{background:var(--paper-2);border-radius:18px;padding:18px;text-align:center;min-width:0}
.mcard .type{font-family:var(--f-round);font-weight:700;font-size:clamp(24px,5vw,44px);letter-spacing:.04em;color:var(--dusty);line-height:1.1}
.mcard.me .type{color:var(--pink-ink)}
.facts{margin:10px 0 0;display:grid;gap:2px;text-align:center}
.facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.facts dd{margin:0;font-family:var(--f-round);font-weight:700;font-size:14px;overflow-wrap:break-word;hyphens:manual}
@media (max-width:420px){.mcard{padding:14px 10px}.facts dd{font-size:13px}}
.duo{max-width:520px!important}
.mcard .who{font-family:var(--f-hand);font-size:19px}
.mcard .nick{font-size:12px;color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase}
.mcard ul{list-style:none;padding:0;margin:12px 0 0;text-align:left;display:grid;gap:6px;font-family:var(--f-hand);font-size:16px}
.mcard li::before{content:"✦ ";color:var(--cobalt-2)}
.axes{display:grid;gap:10px;font-family:var(--f-round);font-weight:700;font-size:20px}
.axis{display:grid;grid-template-columns:24px 64px 24px;align-items:center;gap:6px;text-align:center}
.axis .l{color:var(--pink-ink)}.axis .r{color:var(--dusty)}
.axis .bar{border-top:2px dashed var(--ink-soft);position:relative;opacity:.8}
.axis .bar span{position:absolute;left:50%;top:0;transform:translate(-50%,-55%);font-size:13px;background:var(--paper);padding:0 4px;color:var(--ink-soft)}
.axis.same .bar{border-top:2px solid var(--pink)}
.axis.same .bar span{color:var(--pink-ink)}
.fitlist{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px}
.fitlist li{font-family:var(--f-hand);font-size:18px;padding-left:28px;position:relative}
.fitlist li::before{content:"♡";position:absolute;left:0;color:var(--pink-ink)}


/* ---- embedded player ---- */
.embed{border-radius:14px;overflow:hidden;background:var(--paper-2);max-width:100%}
.embed iframe{display:block;width:100%;border:0}
.embed.yt iframe{aspect-ratio:16/9;height:auto}
.embed.sp iframe{height:152px}
.sync{font-size:12px;color:var(--ink-soft);text-align:center;font-family:var(--f-round)}

/* ---- add-song form ---- */
.addsong{margin-top:26px;background:var(--paper-2);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.addsong h3{font-family:var(--f-round);font-weight:700;font-size:20px;color:var(--dusty)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:10px}
#songWhy{grid-column:1/-1;order:9;resize:vertical;min-height:140px;line-height:1.6}
.ef textarea.tall{min-height:200px}
.ef-photo{display:grid;gap:10px;justify-items:start}
.ef-photo img{width:160px;max-width:100%;height:120px;object-fit:cover;border:5px solid #fff;box-shadow:0 3px 10px var(--shadow);transform:rotate(-2deg)}
.ef-photo img[hidden]{display:none}
.field{border:2px solid var(--line);border-radius:12px;padding:9px 14px;background:var(--paper);color:var(--ink);min-width:0;width:100%;min-height:44px;font-size:15px;transition:border-color .15s,box-shadow .15s}
.field:focus,.diary-form textarea:focus{outline:none;border-color:var(--dusty);box-shadow:0 0 0 4px color-mix(in srgb,var(--dusty) 22%,transparent)}
.field::placeholder,.diary-form textarea::placeholder{color:var(--ink-soft);opacity:.85}
textarea.field{line-height:1.5}
/* two-choice switch (replaces the Maia/Sihao dropdowns) */
.seg-src{position:absolute!important;width:1px!important;height:1px!important;opacity:0;pointer-events:none}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--paper-2);border:2px solid var(--line);border-radius:999px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 16px;min-height:34px;font-family:var(--f-round);font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--pink);color:#4a2333;box-shadow:0 2px 6px var(--shadow)}
.row label,.listen-as label{font-family:var(--f-round);font-weight:700;font-size:14px;color:var(--ink-soft)}
.ticket .del,.polaroid-card .del{border:0;background:transparent;font-size:12px;opacity:.6;padding:0;color:inherit;text-decoration:underline}

/* ---- life updates (timeline) ---- */
.timeline{list-style:none;margin:0;padding:0 0 0 22px;display:grid;gap:18px;border-left:3px dotted var(--cobalt-2)}
.timeline li{position:relative;min-width:0}
.timeline li::before{content:"";position:absolute;left:-32px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--cobalt)}
.timeline .when{font-family:var(--f-round);font-weight:700;color:var(--cobalt);font-size:14px;letter-spacing:.04em}
.timeline .what{font-family:var(--f-hand);font-size:18px;margin:2px 0 0;overflow-wrap:anywhere}
.timeline li.me::before{border-color:var(--pink-ink)}
.timeline li.them::before{border-color:var(--dusty);background:var(--dusty)}
.timeline .by{font-family:var(--f-hand);font-weight:400;color:var(--ink-soft);margin-left:6px}
.timeline .del{border:0;background:transparent;font-size:12px;opacity:.6;padding:0;margin-left:8px;color:inherit;text-decoration:underline}
.updform{display:grid;gap:10px;margin-bottom:24px}
.updform .fields{grid-template-columns:minmax(0,3fr) minmax(0,1fr)}
@media (max-width:520px){.updform .fields{grid-template-columns:1fr}}
.timeline .tag{display:inline-block;font-size:12px;background:var(--butter);color:#4d4220;border-radius:999px;padding:1px 10px;margin-left:6px;vertical-align:middle}

/* ---- polaroid wall ---- */
.pwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:26px 20px;margin-top:10px}
.polaroid-card{position:relative;background:#fff;color:#33506e;padding:10px 10px 12px;box-shadow:0 6px 16px var(--shadow);transform:rotate(var(--r,0deg));transition:transform .25s;min-width:0}
.polaroid-card:hover{transform:rotate(0) scale(1.03);z-index:2}
.polaroid-card::before{content:"";position:absolute;top:-10px;left:50%;width:64px;height:20px;transform:translateX(-50%) rotate(-4deg);background:var(--tape);opacity:.8}
.polaroid-card .ph{aspect-ratio:1;max-width:100%;width:100%;object-fit:cover;display:block;background:linear-gradient(150deg,#dfe8f2,#f3f6fa)}
.polaroid-card .empty{aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:12px;font-family:var(--f-hand);color:#7f98b2;background:repeating-linear-gradient(45deg,#eef3f8 0 10px,#f7f9fc 10px 20px)}
.polaroid-card .cap{font-family:var(--f-hand);font-size:17px;margin-top:8px;overflow-wrap:anywhere;min-height:1.5em}
.polaroid-card .pmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;opacity:.7}
.addphoto{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.addphoto input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.addphoto .field{flex:1 1 200px;width:auto}

/* ---- places map ---- */
.mapframe{border-radius:18px;overflow:hidden;border:6px solid #fff;box-shadow:0 8px 22px var(--shadow);transform:rotate(-.4deg)}
#map{height:clamp(260px,48vw,380px);width:100%;background:#dfe8f2}
#map .leaflet-tile-pane{filter:saturate(.55) brightness(1.04) sepia(.1) hue-rotate(170deg) saturate(.9) hue-rotate(-170deg)}
.maphint{font-size:13px;color:var(--ink-soft);margin:10px 0 0}
.placeform{display:grid;gap:10px;margin:14px 0 22px}
.placeform .fields{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,3fr)}
@media (max-width:560px){.placeform .fields{grid-template-columns:1fr}}
.sr-file{position:absolute;width:1px;height:1px;opacity:0}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pink-ink);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-size:12px;line-height:1}
.pin.home{background:var(--cobalt)}
.pin.temp{background:var(--butter)}
.leaflet-popup-content{font-family:var(--f-round);color:#2b3f63;margin:10px 12px;text-align:center}
.leaflet-popup-content b{font-size:15px}
.leaflet-popup-content img{display:block;width:140px;max-width:100%;height:100px;object-fit:cover;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);margin:0 auto 6px}
.place-card{cursor:pointer}
.place-card .city{font-family:var(--f-round);font-weight:700;font-size:16px;margin-top:6px}

/* ---- biu scene ---- */
.biu-page{padding-block:30px 22px}
.biu-stage{display:block;width:100%;border:0;padding:0;background:transparent;border-radius:14px;cursor:pointer;box-shadow:0 6px 18px var(--shadow)}
.biu-img{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:736/563;background:#fff;border-radius:14px;overflow:hidden}
.biu-img img,.biu-fx{position:absolute;inset:0;width:100%;height:100%;display:block}
.biu-boy{transform-origin:81.5% 93%;transform:rotate(-8deg)}
.biu-hint{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:var(--pink-ink);color:#fff;font-family:var(--f-round);font-weight:700;
  font-size:clamp(13px,2.2vw,16px);padding:8px 16px;border-radius:999px;box-shadow:0 6px 16px rgba(184,84,121,.35);white-space:nowrap;pointer-events:none;
  animation:hintPulse 1.6s ease-in-out infinite;transition:opacity .25s}
.biu-hint.off{opacity:0}
@keyframes hintPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
.biu-stage:hover .biu-hint{background:#a0436a}
.biu-cap{text-align:center;margin:12px 0 0;font-family:var(--f-round);color:var(--ink-soft);display:grid;gap:2px}
.biu-cap b{font-size:18px;color:var(--pink-ink)}

/* ---- the question (yes / runaway no) ---- */
.ask-page{text-align:center}
.ask-box{position:relative;min-height:440px;display:grid;justify-items:center;align-content:start;gap:10px;padding-bottom:20px}
.ask-cat{width:min(210px,56vw);height:auto;max-width:100%;border-radius:50%;border:6px solid #fff;box-shadow:0 10px 26px rgba(184,84,121,.25);animation:catBob 2.4s ease-in-out infinite}
@keyframes catBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.ask-q{font-family:var(--f-hand)!important;font-size:clamp(24px,4.6vw,36px);color:var(--pink-ink)!important;max-width:22ch;text-wrap:balance}
html[lang="zh"] .ask-q{font-family:var(--f-zh)!important}
.ask-sub{margin:0;color:var(--ink-soft);font-family:var(--f-round);max-width:40ch}
.ask-btns{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:10px;min-height:64px}
.ask-yes,.ask-no{font-size:18px;padding:10px 26px;min-width:128px}
.ask-yes{transform:scale(var(--grow,1));transition:transform .25s cubic-bezier(.3,1.6,.5,1);transform-origin:center}
.ask-no{transform:scale(var(--shrink,1)) rotate(var(--tilt,0deg));transition:left .28s cubic-bezier(.3,1.5,.5,1),top .28s cubic-bezier(.3,1.5,.5,1),transform .2s}
.ask-no.loose{position:absolute;z-index:3}
.ask-done{font-family:var(--f-hand);font-size:clamp(22px,4vw,30px);color:var(--pink-ink);margin:6px 0 0}
.ask-said{margin:0;font-family:var(--f-round);font-weight:700;font-size:14px;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.ask-cat{animation:none}}

.yes-card{text-align:center;justify-items:center;max-width:380px}
.yes-card h3{font-family:var(--f-hand)!important;font-weight:400!important;font-size:30px;color:var(--pink-ink)!important}
.yes-pic{width:min(240px,70vw);height:auto;max-width:100%;border-radius:22px;box-shadow:0 10px 24px rgba(184,84,121,.25)}
.yes-when{margin:0;color:var(--ink-soft);font-family:var(--f-round);font-weight:700}

/* ---- lock screen ---- */
html.locked,html.locked body{overflow:hidden}
.gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(circle at 20% 15%,color-mix(in srgb,var(--pink) 45%,transparent),transparent 45%),
             radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--tape) 55%,transparent),transparent 50%),
             radial-gradient(var(--grid) 1.4px,transparent 1.6px) 0 0/22px 22px,var(--sky)}
.gate[hidden]{display:none}
.gate-card{position:relative;width:min(440px,100%);background:var(--paper);border-radius:22px;padding:34px 24px 26px;box-shadow:0 18px 50px var(--shadow);
  display:grid;gap:12px;justify-items:center;text-align:center}
.gate-card::before{content:"";position:absolute;top:-12px;left:50%;width:110px;height:28px;transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(90deg,var(--pink) 0 8px,color-mix(in srgb,var(--pink) 60%,white) 8px 16px);opacity:.9;border-radius:2px}
.gate-langs{position:absolute;top:12px;right:12px;display:flex;gap:2px;background:var(--paper-2);border-radius:999px;padding:3px}
.gate-langs button{border:0;background:transparent;border-radius:999px;padding:2px 10px;font-family:var(--f-hand);font-size:14px;color:var(--ink-soft);cursor:pointer}
.gate-langs button[aria-pressed="true"]{background:var(--pink);color:#4a2333}
.gate-lock{font-size:42px;line-height:1;animation:catBob 2.4s ease-in-out infinite}
.gate-card h1{font-family:var(--f-round);font-weight:700;font-size:clamp(22px,5vw,28px);color:var(--cobalt);text-wrap:balance}
html[lang="zh"] .gate-card h1{font-family:var(--f-zh);font-weight:400}
.gate-sub{margin:0;color:var(--ink-soft);font-size:14px}
.gate-card .field{text-align:center;font-size:17px}
.gate-msg{margin:0;min-height:1.4em;color:var(--pink-ink);font-family:var(--f-round);font-weight:700;font-size:14px}
.gate-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gate-hints{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-family:var(--f-hand);font-size:16px;color:var(--ink)}
.gate-hints li{background:var(--butter);color:#4d4220;border-radius:12px;padding:6px 12px;animation:unfold .35s ease-out}
.gate-card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.gate.opening{animation:gateOut .6s ease forwards}
@keyframes gateOut{to{opacity:0;transform:scale(1.04)}}

/* ---- edit / add controls ---- */
.ctl{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.ctl button{border:1px solid color-mix(in srgb,currentColor 35%,transparent);background:transparent;color:inherit;opacity:.8;font-family:var(--f-round);font-weight:700;font-size:11px;line-height:1;padding:3px 8px;border-radius:999px;cursor:pointer}
.ctl{gap:4px;flex-wrap:wrap}
.ctl button:hover,.ctl button:focus-visible{opacity:1;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.addline{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.addline .field{flex:1 1 180px;width:auto}
.tweak{font-size:14px;color:var(--ink-soft)}
.tweak summary{cursor:pointer;font-family:var(--f-round)}
.minilist{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(18,28,48,.45);display:grid;place-items:center;z-index:70;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.modal-card{background:var(--paper);color:var(--ink);border-radius:18px;padding:20px;width:min(520px,100%);display:grid;gap:14px;box-shadow:0 20px 50px var(--shadow)}

.ef{display:grid;gap:10px;overflow:auto;min-height:0;overscroll-behavior:contain;padding:2px 4px 2px 2px;margin:0 -4px 0 -2px}
#editForm{max-height:calc(100dvh - 32px);grid-template-rows:auto minmax(0,1fr) auto}
#editForm > .row{position:sticky;bottom:0;background:var(--paper);padding-top:10px;border-top:2px dashed var(--line)}
.ef label{display:grid;gap:4px;font-size:13px;color:var(--ink-soft)}
.ef textarea{min-height:90px;resize:vertical}
/* ---- listen together ---- */
.listen-as{font-size:14px;color:var(--ink-soft);margin-bottom:12px}
.presence{color:var(--pink-ink);font-family:var(--f-round);font-weight:700}
.together{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--butter);color:#4d4220;border-radius:14px;padding:10px 14px;margin-bottom:16px;font-family:var(--f-round)}

footer{text-align:center;color:var(--ink-soft);font-family:var(--f-hand)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);

/* ---------- sound (WebAudio, starts only after a tap) ---------- */
let ctx=null, soundOn=false;
// piano: C major pentatonic around middle C, so every tap sounds in key
const SCALE=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99,880.00];
let noiseBuf=null,master=null;
function bus(){ // one shared limiter so chords never clip
  if(!master||master.context!==ctx){master=ctx.createDynamicsCompressor();master.threshold.value=-10;master.knee.value=8;master.ratio.value=8;master.attack.value=.003;master.release.value=.25;master.connect(ctx.destination)}
  return master;
}
function hammer(now,vol){ // short felt "thump" when the hammer hits the string
  if(!noiseBuf){noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.03,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*(1-k/d.length)}
  const n=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain();
  n.buffer=noiseBuf;bp.type="bandpass";bp.frequency.value=1800;bp.Q.value=.8;g.gain.value=vol*.12;
  n.connect(bp).connect(g).connect(bus());n.start(now);
}
function note(i,vol=.18){
  if(!soundOn||!ctx)return;
  const f=SCALE[((i%SCALE.length)+SCALE.length)%SCALE.length], now=ctx.currentTime;
  const out=ctx.createGain(),lp=ctx.createBiquadFilter();
  out.gain.value=vol*1.1;lp.type="lowpass";lp.Q.value=.4;
  lp.frequency.setValueAtTime(Math.min(f*10,9000),now);lp.frequency.exponentialRampToValueAtTime(f*2.5,now+1.8);
  lp.connect(out).connect(bus());
  // [harmonic, level, decay seconds]: higher partials fade faster, like a real string
  [[1,1,3.6],[1,.45,3.3,1.0012],[2,.42,2.4],[3,.2,1.6],[4,.12,1.1],[5,.06,.8],[6,.035,.55],[7,.02,.4]].forEach(([h,a,d,det=1])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=f*h*det*Math.sqrt(1+.00035*h*h); // slight stretch = piano inharmonicity
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(a,now+.004);
    g.gain.exponentialRampToValueAtTime(a*.45,now+.15);g.gain.exponentialRampToValueAtTime(.0001,now+d);
    o.connect(g).connect(lp);o.start(now);o.stop(now+d+.05);
  });
  hammer(now,vol);
}
$("#sound").onclick=()=>{
  soundOn=!soundOn;
  if(soundOn&&!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch{soundOn=false}}
  if(ctx&&ctx.state==="suspended")ctx.resume();
  $("#sound").setAttribute("aria-pressed",soundOn);$("#sound").textContent=t(soundOn?"soundOn":"soundOff");
  if(soundOn){note(0);setTimeout(()=>note(2),160);setTimeout(()=>note(4),320)}
};

const PLACE_OF={diary:["nhật ký","#diary"],songs:["playlist","#songs"],updates:["dạo này","#updates"],photos:["ảnh","#photos"],places:["bản đồ","#places"],

function tell(msg,hash,key,everyMs){
  if(!CONFIG.ntfyTopic||typeof meWho==="undefined"||meWho!=="them")return;
  const at=store.get("pingAt",{}),now=Date.now();if(key&&at[key]&&now-at[key]<everyMs)return;
  if(key){at[key]=now;store.set("pingAt",at)}
  fetch("https://ntfy.sh/"+CONFIG.ntfyTopic,{method:"POST",body:msg,
    headers:{Title:"a notebook for you",Tags:"sparkles",Click:location.href.split("#")[0]+(hash||"")}}).catch(()=>{});
}
function track(kind,tb,row){
  const sc=tb==="items"?(row&&row.section):tb;if(sc==="answer")return;
  const [name,hash]=PLACE_OF[sc]||["sổ","#"];
  let msg;
  if(kind==="add")msg={diary:"📝 Sihao vừa viết nhật ký",songs:`🎵 Sihao vừa thêm bài: ${row&&row.title||""}`,updates:"🌱 Sihao vừa viết vào 'dạo này'",
    photos:"📷 Sihao vừa thêm ảnh",places:`🗺️ Sihao vừa ghim ${row&&row.name||"một nơi"} lên bản đồ`,memory:"💭 Sihao vừa thêm một kỷ niệm",
    cheer:"📣 Sihao vừa thêm lời cổ vũ",fix:"✏️ Sihao vừa thêm vào 'điều sẽ sửa'"}[sc]||`✨ Sihao vừa thêm vào ${name}`;
  else if(kind==="edit")msg=`✎ Sihao vừa sửa ${name}`;
  else msg=`🗑️ Sihao vừa xoá một mục ở ${name}`;
  tell(msg,hash,kind+":"+sc,kind==="add"&&sc!=="photos"?0:60000);
}
const Data={
  async list(tb){
    if(SB){const {data,error}=await SB.from(tb).select("*").order("created_at",{ascending:false});if(error){console.warn(error);return null}return data}
    return store.get(LKEY(tb),[]);
  },
  async add(tb,row){
    if(SB){const {error}=await SB.from(tb).insert(row);if(error){console.warn(error);toast(t("syncErr"));return false}track("add",tb,row);return true}
    const l=store.get(LKEY(tb),[]);l.unshift({...row,id:uid(),created_at:new Date().toISOString()});
    return store.set(LKEY(tb),l);
  },
  async update(tb,id,patch){
    if(SB){const {error}=await SB.from(tb).update(patch).eq("id",id);if(error){console.warn(error);toast(t("syncErr"));return false}return true}
    return store.set(LKEY(tb),store.get(LKEY(tb),[]).map(r=>r.id===id?{...r,...patch}:r));
  },
  async remove(tb,id){
    if(SB){const {error}=await SB.from(tb).delete().eq("id",id);if(error){toast(t("syncErr"));return false}return true}
    return store.set(LKEY(tb),store.get(LKEY(tb),[]).filter(r=>r.id!==id));
  },
};

let io;
function observeReasons(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{
    const el=en.target;
    if(en.isIntersecting&&!el.classList.contains("lit")){
      el.classList.add("lit");note(+el.dataset.i);
      if(soundOn){const f=document.createElement("span");f.className="note-fly";f.textContent="♪";el.style.position="relative";f.style.right="10px";f.style.top="6px";el.appendChild(f);setTimeout(()=>f.remove(),1300)}
    }else if(!en.isIntersecting)el.classList.remove("lit");
  }),{threshold:.7});
  document.querySelectorAll(".reason").forEach(el=>io.observe(el));
}
/* vinyl player: Spotify/YouTube embed when a song has a link, otherwise a short piano melody */
let cur=0, playing=false, tuneTimer=null;
let mySongs=[];
const allSongs=()=>(SB?[]:CONFIG.songs).concat(mySongs.map(s=>({...s,mine:true})));
let autoplayNext=false;
function embedOf(link){
  if(!link)return null;let m;
  if(m=link.match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|album|playlist|episode)\/([A-Za-z0-9]+)/))
    return {kind:"sp",src:`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator`};
  if(m=link.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/))
    return {kind:"yt",src:`https://www.youtube-nocookie.com/embed/${m[1]}`};
  return null;
}
const listenUrl=s=>/^https?:\/\//.test(s.link||"")?s.link:`https://www.youtube.com/results?search_query=${encodeURIComponent(s.title+" "+(s.artist||""))}`;
const TUNES=[[0,2,4,2,5,4,2,0],[4,5,4,2,0,2,4,4],[2,4,5,6,5,4,2,1],[0,4,2,5,4,6,5,4]];
function playTune(){
  clearInterval(tuneTimer);let k=0;const tune=TUNES[cur%TUNES.length];
  if(!soundOn){$("#sound").click()}
  tuneTimer=setInterval(()=>{note(tune[k++%tune.length],.14)},380);
}
function setPlaying(p){
  playing=p;$("#vinyl").classList.toggle("spin",p);$("#arm").classList.toggle("on",p);
  clearInterval(tuneTimer);
  const s=allSongs()[cur];
  if(p&&!(s&&embedOf(s.link)))playTune();
  renderNow();
}
let shownEmbed="";
function renderNow(){
  const list=allSongs();if(cur>=list.length)cur=0;const s=list[cur];
  if(!s){$("#nowPlaying").innerHTML=`<p class="why">${t("noSongs")}</p>`;$("#nowEmbed").innerHTML="";shownEmbed="";return}
  const em=embedOf(s.link);
  const head=`<h3>${esc(s.title)}${ctl("songs",s.mine?s.id:null)}</h3><div class="artist">${esc(s.artist||"")}</div><p class="why">${esc(L(s.why))}</p>
    <div class="ctrl">${em?"":`<button class="pbtn" id="pp" aria-label="${playing?"pause":"play"}">${playing?"❚❚":"▶"}</button>`}
    <a href="${esc(listenUrl(s))}" target="_blank" rel="noopener">${t("listen")} ↗</a></div>`;
  $("#nowPlaying").innerHTML=head;
  // keep the iframe alive across re-renders so playback doesn't stop
  if(!(em&&shownEmbed===em.src&&$("#nowEmbed").querySelector(".embed"))){
    shownEmbed=em?em.src:"";
    const src=em?em.src+(em.kind==="yt"&&autoplayNext?"?autoplay=1":""):"";autoplayNext=false;
    $("#nowEmbed").innerHTML=em?`<div class="embed ${em.kind}"><iframe src="${esc(src)}" title="${esc(s.title)}" loading="lazy"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`:"";
  }
  const pp=$("#pp");if(pp)pp.onclick=()=>setPlaying(!playing);
}
function renderSongs(){

function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const sc=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);res(c)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
$("#photoFile").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";const cap=$("#photoCap").value.trim();
  for(const f of files){
    let c;try{c=await shrink(f)}catch{toast(t("photoErr"));continue}
    if(SB){
      const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82)),path=uid()+".jpg";
      const up=await SB.storage.from("photos").upload(path,blob,{contentType:"image/jpeg"});
      if(up.error){console.warn(up.error);toast(t("syncErr"));break}
      const src=SB.storage.from("photos").getPublicUrl(path).data.publicUrl;
      if(!await Data.add("photos",{src,path,cap}))break;
    }else if(!await Data.add("photos",{src:c.toDataURL("image/jpeg",.78),cap})){toast(t("photoFull"));break}
  }
  $("#photoCap").value="";loadPhotos();note(3);
};

/* ---------- places: Leaflet map + pins ---------- */
let myPlaces=[],map=null,pinLayer=null,tempPin=null,pickLatLng=null;
const HOMES=[{who:"me",lat:21.0285,lng:105.8542,key:"homeMe"},{who:"them",lat:31.2989,lng:120.5853,key:"homeThem"}];
function pinIcon(cls,emoji){return L_ ? L_.divIcon({className:"",html:`<div class="pin ${cls}"><span>${emoji}</span></div>`,iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]}) : null}
const L_=window.LeafletLib; // Leaflet, saved before our own L() text helper replaced window.L
function initMap(){
  if(!L_||map)return;
  map=L_.map("map",{scrollWheelZoom:false,worldCopyJump:true}).setView([25,112],3);
  L_.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  pinLayer=L_.layerGroup().addTo(map);renderPlaces();fitPins();
  new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){fitPins();o.disconnect()}},{threshold:.3}).observe($("#map"));
  map.on("click",e=>{
    pickLatLng=e.latlng;
    if(tempPin)tempPin.setLatLng(e.latlng);else tempPin=L_.marker(e.latlng,{icon:pinIcon("temp","✦")}).addTo(map);
    $("#mapHint").textContent=t("pinPlaced");$("#plName").focus();
  });
}
function renderPlaces(){
  if(map){
    pinLayer.clearLayers();
    HOMES.forEach(h=>L_.marker([h.lat,h.lng],{icon:pinIcon("home","⌂")}).bindPopup(`<b>${esc(t(h.key))}</b>`).addTo(pinLayer));
    myPlaces.forEach(p=>{
      L_.marker([p.lat,p.lng],{icon:pinIcon("","♡")})
        .bindPopup(`${p.src?`<img src="${esc(p.src)}" alt="">`:""}<b>${esc(p.name)}</b>${p.visited?`<br>${esc(p.visited)}`:""}${p.note?`<br><small>${esc(p.note)}</small>`:""}`)
        .addTo(pinLayer);
    });
  }
  $("#placeList").innerHTML=myPlaces.map((p,i)=>`<figure class="polaroid-card place-card" data-fly="${esc(p.id)}" style="--r:${[-2,2,-1,3,-3,1][i%6]}deg;margin:0">
    ${p.src?`<img class="ph" src="${esc(p.src)}" alt="${esc(p.name)}" loading="lazy">`:`<div class="empty">📍 ${esc(p.name)}</div>`}
    <div class="city">${esc(p.name)}</div><figcaption class="cap">${esc(p.note||"")}</figcaption>
    <div class="pmeta"><span>${esc(p.visited||"")}</span>${ctl("places",p.id)}</div></figure>`).join("");
}
function fitPins(){
  if(!map)return;map.invalidateSize();const pts=myPlaces.map(p=>[p.lat,p.lng]).concat(HOMES.map(h=>[h.lat,h.lng]));
  if(pts.length)map.fitBounds(pts,{padding:[56,56],maxZoom:5});
}
let firstFit=true;
async function loadPlaces(){const d=await Data.list("places");if(d){myPlaces=d.slice().reverse();renderPlaces();if(firstFit){fitPins();firstFit=false}}}
$("#placeList").addEventListener("click",e=>{
  if(e.target.closest(".ctl"))return;
  const c=e.target.closest("[data-fly]");if(!c||!map)return;const p=myPlaces.find(x=>x.id===c.dataset.fly);if(!p)return;
  map.flyTo([p.lat,p.lng],8,{duration:1.2});$("#map").scrollIntoView({behavior:"smooth",block:"center"});
});
$("#plPhoto").onchange=e=>{$("#plPhotoLbl").textContent=t(e.target.files.length?"photoPicked":"placePhoto")};
async function geocode(q){
  const url=`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}&accept-language=${lang==="zh"?"zh":lang}`;
  const r=await fetch(url,{headers:{Accept:"application/json"}});if(!r.ok)return null;
  const j=await r.json();return j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null;
}

/* ---------- biu: hearts fly from her finger to him; he gets knocked back ---------- */
const NS="http://www.w3.org/2000/svg";
let biuBusy=false,lastBiu=0;
function biu(){
  if(biuBusy)return;biuBusy=true;lastBiu=Date.now();$("#biuHint").classList.add("off");setTimeout(()=>$("#biuHint").classList.remove("off"),2600);
  const boy=$("#biuBoy"),hearts=$("#biuHearts"),petals=$("#petals"),txt=$("#biuText");
  hearts.innerHTML="";petals.innerHTML="";boy.getAnimations().forEach(a=>a.cancel());
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){boy.style.transform="none";biuBusy=false;return}
  boy.style.transform="rotate(-8deg)";
  txt.animate([{opacity:0,transform:"translate(0,10px) scale(.7)"},{opacity:1,transform:"translate(0,0) scale(1.1)",offset:.3},{opacity:1,transform:"none",offset:.8},{opacity:0,transform:"translate(0,-12px)"}],{duration:1700,easing:"ease-out"});
  note(4);
  const from={x:372,y:124},to={x:585,y:150};
  [0,1,2].forEach(i=>{
    const u=document.createElementNS(NS,"use");u.setAttribute("href","#hrt");hearts.appendChild(u);
    const lift=-50-18*i;
    const a=u.animate([
      {transform:`translate(${from.x}px,${from.y}px) scale(.7)`,opacity:0},
      {transform:`translate(${(from.x+to.x)/2}px,${(from.y+to.y)/2+lift}px) scale(${1.9-i*.25})`,opacity:1,offset:.5},
      {transform:`translate(${to.x}px,${to.y}px) scale(1.1)`,opacity:1}],
      {duration:700,delay:i*170,easing:"cubic-bezier(.35,.1,.45,1)",fill:"both"});
    a.onfinish=()=>{u.remove();if(i===0)onHit()};
  });
  function onHit(){
    note(7);setTimeout(()=>note(9),120);
    boy.animate([{transform:"rotate(-8deg)"},{transform:"rotate(6deg)",offset:.3},{transform:"rotate(-2deg)",offset:.6},{transform:"rotate(0deg)"}],{duration:950,easing:"ease-out",fill:"forwards"});
    const pop=document.createElementNS(NS,"use");pop.setAttribute("href","#hrt");hearts.appendChild(pop);
    pop.animate([{transform:"translate(618px,52px) scale(.4)",opacity:0},{transform:"translate(618px,40px) scale(2.2)",opacity:1,offset:.4},{transform:"translate(618px,44px) scale(1.8)",opacity:1}],{duration:700,fill:"forwards"});
    for(let k=0;k<20;k++){
      const e=document.createElementNS(NS,"ellipse");e.setAttribute("rx",6);e.setAttribute("ry",3.5);
      e.setAttribute("fill",["#f6b7c7","#f3c6d2","#e9a0b6","#fbd7e2","#f5c2a8"][k%5]);petals.appendChild(e);
      const ang=-Math.PI*(.1+.8*Math.random()),dist=70+110*Math.random(),x=590,y=140;
      e.animate([{transform:`translate(${x}px,${y}px) rotate(0)`,opacity:1},
        {transform:`translate(${x+Math.cos(ang)*dist}px,${y+Math.sin(ang)*dist+60}px) rotate(${360*Math.random()}deg)`,opacity:0}],
        {duration:1500+700*Math.random(),easing:"ease-out",fill:"forwards"});
    }
    setTimeout(()=>{biuBusy=false},1200);
  }
}

/* ---------- two-choice switches (keep the <select> for forms, show buttons) ---------- */
function segs(){
  document.querySelectorAll("select").forEach(sel=>{
    let seg=sel.nextElementSibling;
    if(!seg||!seg.classList.contains("seg")){
      seg=document.createElement("div");seg.className="seg";seg.setAttribute("role","radiogroup");
      const lab=sel.id&&document.querySelector(`label[for="${sel.id}"]`);if(lab)seg.setAttribute("aria-label",lab.textContent);
      sel.after(seg);sel.classList.add("seg-src");sel.tabIndex=-1;
      seg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||sel.value===b.dataset.v)return;sel.value=b.dataset.v;sel.dispatchEvent(new Event("change",{bubbles:true}))});
      sel.addEventListener("change",()=>paintSeg(sel,seg));
    }
    paintSeg(sel,seg);
  });
}
function paintSeg(sel,seg){seg.innerHTML=[...sel.options].map(o=>`<button type="button" role="radio" aria-checked="${o.value===sel.value}" data-v="${esc(o.value)}">${esc(o.textContent)}</button>`).join("")}

/* ---------- the question: Yes celebrates, No runs away ---------- */
const NO_LINES={
  vi:["Không","Chắc chưa?","Nghĩ lại đi mà","Hông bấm được đâu","Năn nỉ đó 🥺","Bấm Đồng ý đi 💗","Sai nút rồi!"],
  en:["No","Are you sure?","Think again!","Can't catch me","Pretty please 🥺","Press Yes instead 💗","Wrong button!"],
  zh:["不要","确定吗？","再想想嘛","抓不到我","求求你 🥺","点「好呀」嘛 💗","按错啦！"]};
let noTries=0;
function dodge(e){tell("😆 Sihao đang cố bấm No","#ask","no",3600000);
  if(e){e.preventDefault();e.stopPropagation()}
  const box=$("#askBox"),no=$("#askNo"),B=box.getBoundingClientRect();
  if(!no.classList.contains("loose")){const r=no.getBoundingClientRect();no.style.left=(r.left-B.left)+"px";no.style.top=(r.top-B.top)+"px";no.classList.add("loose");no.offsetWidth}
  noTries++;
  const lines=NO_LINES[lang]||NO_LINES.en;no.textContent=lines[noTries%lines.length];
  const w=no.offsetWidth,h=no.offsetHeight,pad=8;
  const yes=$("#askYes").getBoundingClientRect();
  let x,y,tries=0;
  do{ // land somewhere inside the card, not on top of the Yes button
    x=pad+Math.random()*Math.max(1,B.width-w-pad*2);y=pad+Math.random()*Math.max(1,B.height-h-pad*2);tries++;
  }while(tries<20&&x+B.left<yes.right+10&&x+B.left+w>yes.left-10&&y+B.top<yes.bottom+10&&y+B.top+h>yes.top-10);
  no.style.left=x+"px";no.style.top=y+"px";
  no.style.setProperty("--shrink",Math.max(1-noTries*.06,.6));no.style.setProperty("--tilt",((Math.random()-.5)*16).toFixed(1)+"deg");
  no.animate([{translate:"0 0"},{translate:"-6px 0"},{translate:"6px 0"},{translate:"-4px 0"},{translate:"0 0"}],{duration:320,delay:260});
  $("#askYes").style.setProperty("--grow",Math.min(1+noTries*.08,1.8));
  note(noTries%5);
}
const askNo=$("#askNo");
askNo.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")dodge()});
askNo.addEventListener("pointerdown",dodge);
askNo.addEventListener("click",dodge);
askNo.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")dodge(e)});
$("#askYes").onclick=async e=>{

/* ---------- lock screen ---------- */
// only hashes of the accepted answers live here, never the answer itself
const GATE_OK=["a6742dbb89ab07051dea3818d761d6ce64aa23558eb852917573f59e63a20903","325d2cfa1f9ef95e493377805edbddba80f37229756ce39fb967a9bc05c62086"];
const gateNorm=x=>x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
async function gateHash(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("notebook:"+gateNorm(x)));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
let hintsShown=0;
function renderGate(){
  document.querySelectorAll("[data-gl]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.gl===lang));
  const hs=t("gateHints").split("|");$("#gateHints").innerHTML=hs.slice(0,hintsShown).map(h=>`<li>${esc(h)}</li>`).join("");
}
document.querySelectorAll("[data-gl]").forEach(b=>b.onclick=()=>setLang(b.dataset.gl));
$("#gateHint").onclick=()=>{const n=t("gateHints").split("|").length;if(hintsShown>=n){$("#gateMsg").textContent=t("gateNoMore");return}hintsShown++;renderGate();note(hintsShown+1)};
$("#gateForm").onsubmit=async e=>{
  e.preventDefault();const v=$("#gateIn").value;if(!v.trim())return;
  let ok=false;try{ok=GATE_OK.includes(await gateHash(v))}catch{ok=false}
  if(!ok){const c=$("#gateForm");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");$("#gateMsg").textContent=t("gateWrong");note(0);return}
  $("#gateMsg").textContent=t("gateRight");
  try{localStorage.setItem("nb_unlocked","1")}catch{}
  [0,2,4,7].forEach((n,i)=>setTimeout(()=>note(n),i*140));
  tell("🔓 Sihao vừa mở khoá cuốn sổ","","unlock",3600000);
  const g=$("#gate");g.classList.add("opening");setTimeout(()=>{g.hidden=true;document.documentElement.classList.remove("locked");if(map)map.invalidateSize()},600);
};
if(!$("#gate").hidden)setTimeout(()=>$("#gateIn").focus(),300);

function setLang(l){
  lang=l;store.set("lang",l);document.documentElement.lang=l;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  $("#sound").textContent=t(soundOn?"soundOn":"soundOff");

  renderLetter();renderPresence();renderPlaces();segs();renderAsk();renderGate();
}

/* ---------- start: connect Supabase if configured, then load shared data ---------- */
(async()=>{
  const cfg=CONFIG.supabase||{};
  if(cfg.url&&cfg.anonKey){
    try{
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js");
      SB=window.supabase.createClient(cfg.url,cfg.anonKey);
      $("#syncNote").dataset.i18n="syncOn";$("#syncNote").textContent=t("syncOn");
      SB.channel("notebook")
        .on("postgres_changes",{event:"*",schema:"public",table:"diary"},loadDiary)
        .on("postgres_changes",{event:"*",schema:"public",table:"songs"},loadSongs)
        .on("postgres_changes",{event:"*",schema:"public",table:"photos"},loadPhotos)
        .on("postgres_changes",{event:"*",schema:"public",table:"updates"},loadUpdates)
        .on("postgres_changes",{event:"*",schema:"public",table:"items"},loadItems)
        .on("postgres_changes",{event:"*",schema:"public",table:"places"},loadPlaces)
        .subscribe();
    }catch(err){console.warn("Supabase unavailable, using this browser only",err);SB=null}
  }
  initListen();initMap();if($("#gate").hidden)tell("👀 Sihao đang xem trang","","visit",1800000);
  await Promise.all([loadPlaces(),loadDiary(),loadSongs(),loadPhotos(),loadUpdates(),loadItems()]);
})();
</script>
